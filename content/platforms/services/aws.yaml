- {provider: aws, category: object-storage, name: "Amazon S3", serverless: true, summary: "The default data lake store: virtually unlimited, 11 nines of durability, storage classes from Standard to Glacier.", pricing: "Per GB-month stored, plus requests and egress.", url: "https://aws.amazon.com/s3/"}
- {provider: aws, category: table-format, name: "S3 Tables (Apache Iceberg)", serverless: true, open_source_base: "Apache Iceberg", summary: "S3 buckets that store Iceberg tables natively, with automatic compaction and snapshot management. Glue and Athena also read and write Iceberg on plain S3.", pricing: "Storage plus request and maintenance fees.", url: "https://aws.amazon.com/s3/features/tables/"}
- {provider: aws, category: warehouse, name: "Amazon Redshift", summary: "Columnar MPP warehouse. Provisioned clusters (RA3, storage separated on S3) or Redshift Serverless measured in RPUs. Spectrum queries S3 directly.", pricing: "Serverless per RPU-hour while queries run; provisioned per node-hour.", url: "https://aws.amazon.com/redshift/"}
- {provider: aws, category: operational-db, name: "Aurora, RDS and DynamoDB", summary: "Managed Postgres/MySQL (RDS, Aurora) and a key-value store at any scale (DynamoDB). Typical pipeline sources.", pricing: "Instance-hours or capacity units.", url: "https://aws.amazon.com/rds/aurora/"}
- {provider: aws, category: ingestion, name: "AWS DMS and AppFlow", summary: "Database Migration Service does full loads plus ongoing CDC from Oracle, SQL Server, Postgres and others; AppFlow pulls from SaaS apps.", pricing: "Replication instance-hours (or DCUs serverless).", url: "https://aws.amazon.com/dms/"}
- {provider: aws, category: event-streaming, name: "Kinesis Data Streams and Amazon MSK", summary: "Kinesis is AWS-native streaming with shards; MSK is managed Apache Kafka (also serverless).", pricing: "Per shard-hour or per stream-hour plus throughput; MSK per broker-hour.", open_source_base: "Apache Kafka (MSK)", url: "https://aws.amazon.com/msk/"}
- {provider: aws, category: stream-processing, name: "Managed Service for Apache Flink", open_source_base: "Apache Flink", summary: "Hosted Flink applications for stateful stream processing with event time and exactly-once checkpoints.", pricing: "Per KPU-hour.", url: "https://aws.amazon.com/managed-service-apache-flink/"}
- {provider: aws, category: batch-processing, name: "AWS Glue and Amazon EMR", open_source_base: "Apache Spark", summary: "Glue runs serverless Spark ETL jobs; EMR runs Spark, Hive, Trino and Flink on clusters, EKS or serverless.", pricing: "Glue per DPU-hour; EMR per instance-hour plus a small uplift.", url: "https://aws.amazon.com/glue/"}
- {provider: aws, category: transformation, name: "dbt on Redshift/Athena (partner)", summary: "No first-party dbt equivalent; teams run dbt Core or dbt Cloud against Redshift or Athena, or use Glue jobs.", pricing: "Warehouse compute.", url: "https://docs.getdbt.com/docs/core/connect-data-platform/redshift-setup"}
- {provider: aws, category: orchestration, name: "MWAA and Step Functions", open_source_base: "Apache Airflow (MWAA)", summary: "Managed Workflows for Apache Airflow for DAGs; Step Functions for serverless state machines that call AWS services.", pricing: "MWAA per environment-hour; Step Functions per state transition.", url: "https://aws.amazon.com/managed-workflows-for-apache-airflow/"}
- {provider: aws, category: lake-query, name: "Amazon Athena", serverless: true, open_source_base: "Trino/Presto", summary: "Serverless SQL over S3 (Parquet, ORC, Iceberg, CSV) using the Glue Data Catalog. Partitioning and columnar formats cut the bill directly.", pricing: "Per TB scanned (10 MB minimum per query), or provisioned capacity.", url: "https://aws.amazon.com/athena/"}
- {provider: aws, category: bi, name: "Amazon QuickSight", serverless: true, summary: "Serverless BI with SPICE in-memory engine and Q natural-language queries.", pricing: "Per user per month (author/reader) or capacity.", url: "https://aws.amazon.com/quicksight/"}
- {provider: aws, category: catalog, name: "Glue Data Catalog, Lake Formation and SageMaker Catalog", summary: "The Glue catalog is the Hive-compatible metastore every AWS engine shares; Lake Formation adds fine-grained permissions; DataZone/SageMaker Catalog adds business metadata and sharing.", pricing: "Catalog per object and request; Lake Formation mostly free.", url: "https://aws.amazon.com/lake-formation/"}
- {provider: aws, category: ml-platform, name: "Amazon SageMaker AI", summary: "Notebooks, training jobs, experiments, model registry, feature store and endpoints. SageMaker Unified Studio brings data and AI tools together.", pricing: "Per instance-hour for notebooks, training and endpoints.", url: "https://aws.amazon.com/sagemaker/"}
- {provider: aws, category: genai, name: "Amazon Bedrock", serverless: true, summary: "API access to foundation models (Anthropic Claude, Amazon Nova, Llama, Mistral and others), with knowledge bases, agents and guardrails.", pricing: "Per input/output token, or provisioned throughput.", url: "https://aws.amazon.com/bedrock/"}
- {provider: aws, category: vector-search, name: "OpenSearch, S3 Vectors and Aurora pgvector", summary: "OpenSearch Serverless vector collections, S3 Vectors for cheap large indexes, or pgvector in Aurora/RDS; Bedrock Knowledge Bases wire them to RAG.", pricing: "OCU-hours (OpenSearch); storage and queries (S3 Vectors).", url: "https://aws.amazon.com/s3/features/vectors/"}
- {provider: aws, category: serverless-compute, name: "AWS Lambda", serverless: true, summary: "Event-driven functions (up to 15 minutes), triggered by S3, Kinesis, SQS, API Gateway and schedules.", pricing: "Per request and GB-second.", url: "https://aws.amazon.com/lambda/"}

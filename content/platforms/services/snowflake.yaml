- {provider: snowflake, category: warehouse, name: "Virtual warehouses", summary: "Independent compute clusters (X-Small to 6X-Large) over shared storage; each team or workload gets its own, they suspend when idle and multi-cluster warehouses add concurrency.", pricing: "Credits per second of running warehouse (60 s minimum); credit price by edition and region.", url: "https://docs.snowflake.com/en/user-guide/warehouses-overview"}

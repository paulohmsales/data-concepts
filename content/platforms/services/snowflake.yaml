- {provider: snowflake, category: object-storage, name: "Internal and external stages", summary: "Snowflake stores table data in its own managed storage on the host cloud; stages point at files in S3, GCS or Azure for loading and external tables.", pricing: "Storage per TB-month (on-demand or capacity).", url: "https://docs.snowflake.com/en/user-guide/data-load-overview"}

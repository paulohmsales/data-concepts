slug: join-fanout
title: Grain and join fan-out
track: analytics-engineering
summary: why revenue doubles after a join, the SUM(DISTINCT) trap and the LEFT JOIN that isn’t.
roles:
- ae
- da
- de
lab: join-fanout
order: 1
intuition: |
  Every table has a **grain**: what one row means. One row per order, per order line, per payment, per customer-day. Write it down for every model, because almost every wrong number in analytics comes from mixing grains without noticing.

  When you join an order (one row) to its items (many rows), the order is copied once per item. That is correct, since the join has to put the order next to each item. But the order-level numbers on those copies are now repeated, so summing them counts each order several times. That is **fan-out**. Two one-to-many joins on the same key multiply: 3 items × 2 payments = 6 copies.

  Nothing errors. The query runs, the row count looks plausible, and the total is simply too big. The fix is to bring each table to the grain you want *before* joining, and to test the grain (a unique key test) on every model.
check:
- q: What is the grain of a table, and why write it down?
  a: |-
    What one row represents (one order, one order line, one user per day). Every measure is only safely additive at its own grain; knowing it tells you which joins will repeat rows and which aggregations are valid.
- q: Why does joining orders to order items inflate total revenue?
  a: |-
    The join emits one row per (order, item) pair, so each order’s amount appears once per item. Summing amount over those rows counts each order as many times as it has lines.
- q: Why is SUM(DISTINCT amount) not a fix?
  a: |-
    DISTINCT removes duplicate values, not duplicate rows: two different orders with the same amount collapse into one, so you undercount. You need to deduplicate by key (aggregate to order grain), not by value.
- q: You need revenue, item count and amount paid per customer. How do you structure the query?
  a: |-
    Aggregate each fact table to a common grain first (order or customer) in separate CTEs, then join those one-to-one on the key. Add a uniqueness test on the key at each step.
- q: Why does a WHERE condition on the right table turn a LEFT JOIN into an inner join?
  a: |-
    Unmatched rows have NULLs in the right table’s columns, and any comparison with NULL is not true, so WHERE removes them. Put the condition in the ON clause (or allow IS NULL) to keep unmatched left rows.

slug: agents
title: Agents and tool use
track: ai-engineering
summary: why 95%-reliable steps make a 60%-reliable agent, and how checks, retries and budgets change the odds.
roles: [ai, mle, swe]
lab: agents
order: 4

intuition: |
  An **agent** is an LLM in a loop: it decides on an action (call a tool: search, run SQL, call an API), reads the result, and decides the next action, until it believes the task is done. A **chain** (or workflow) is a fixed sequence of LLM calls that you designed; an agent chooses its own sequence.

  The appeal is flexibility. The catch is arithmetic. If each step is right 95% of the time and a task needs 10 steps, the whole task is right only 0.95¹⁰ ≈ 60% of the time, and the failures aren’t always visible, because a wrong intermediate result can flow quietly into a confident final answer.

  What saves agents is the same thing that saves distributed systems: **checking results**. Validate tool outputs, let the model re-read and retry when something looks wrong, cap the number of steps, and keep tasks short. The lab lets you move each of those levers.

experiments:
  - title: Ten good steps make a mediocre agent
    goal: Ten steps at 95% each, no error checking.
    setup: {steps: 10, p: 0.95, detect: 0, slack: 2}
    look: About 60% of tasks succeed; the other 40% fail silently.
    why: |
      Success requires every step to be right: 0.95¹⁰ = 0.60. Each extra step multiplies in another 0.95, which is why long autonomous tasks degrade so fast.
  - title: Make each step more reliable
    goal: The same ten steps at 99%.
    setup: {steps: 10, p: 0.99, detect: 0}
    look: About 90% success. The curve for p = 0.99 stays high far longer.
    why: |
      0.99¹⁰ ≈ 0.90. Better tools (clear schemas, fewer choices per step, good error messages) and better prompts raise p, the most powerful lever because it is raised to the power k.
  - title: Catch errors and retry
    goal: Back to 90% per step, but 80% of errors are noticed and retried.
    setup: {steps: 10, p: 0.9, detect: 0.8, slack: 2}
    look: Success jumps from about 35% to about 80%; the trace shows orange retries instead of red failures.
    why: |
      A caught error costs a retry instead of the task. Per step, success becomes p / (p + (1 − p)(1 − detect)): 0.9 / (0.9 + 0.1 × 0.2) ≈ 0.98, and 0.98¹⁰ ≈ 0.80. Validators, schema checks and asking the model to verify tool outputs buy this.
  - title: A budget too tight
    goal: Retries help only if there is room for them. Budget equal to the minimum number of steps.
    setup: {steps: 10, p: 0.9, detect: 0.8, slack: 1}
    look: Many runs now end “out of budget” instead of succeeding.
    why: |
      Every retry consumes a step. A budget with no slack turns caught errors into failures anyway. Budgets matter for cost and runaway loops, but they need headroom proportional to the expected retries (about k/p calls).
  - title: Long tasks
    goal: 30 steps at 97%, with good error checking.
    setup: {steps: 30, p: 0.97, detect: 0.9, slack: 2}
    look: Even with checks, success sits well below single-step reliability; calls per success climbs.
    why: |
      Splitting work into shorter, verifiable sub-tasks (or fixed workflows where the path is known) beats one long autonomous run. Use an agent where you genuinely don’t know the path in advance.

deep_dive:
  - type: heading
    text: The loop
  - type: stepper
    key: diagram.flow
    props:
      nodes:
        - {id: goal, label: Task, sub: "user request", col: 0, row: 0}
        - {id: think, label: LLM decides, sub: "next action or finish", col: 1, row: 0}
        - {id: tool, label: Tool call, sub: "search, SQL, API", col: 2, row: 0}
        - {id: result, label: Result, sub: "data or error", col: 3, row: 0}
        - {id: check, label: Check, sub: "schema, sanity, policy", col: 2, row: 1}
        - {id: done, label: Answer, sub: "with evidence", col: 0, row: 1}
      edges:
        - {from: goal, to: think}
        - {from: think, to: tool}
        - {from: tool, to: result}
        - {from: result, to: check}
        - {from: check, to: think, label: feedback}
        - {from: think, to: done}
    steps:
      - title: Decide
        md: The model sees the task, the tools available (names, descriptions, JSON schemas) and the history so far, and returns either a tool call with arguments or a final answer.
        state: {active: [goal, think, tool]}
      - title: Act and observe
        md: Your code executes the tool, not the model, and returns the result (or the error message) to the model as the next message.
        state: {active: [think, tool, result]}
      - title: Check before trusting
        md: Validate the result (schema, empty results, out-of-range values, permission errors). Feed failures back explicitly so the model can retry differently, instead of building on a bad result.
        state: {active: [result, check, think]}
      - title: Stop
        md: The loop ends when the model answers, or when a step or cost budget runs out. Return the answer with the evidence (tool results) it relied on.
        state: {active: [think, done]}
      - title: The silent failure
        md: A tool returns plausible but wrong data (an empty query result, a stale record) and nothing checks it. Every later step builds on it, and the final answer is confidently wrong.
        state: {active: [tool, result, think, done], bad: [result], note: "unchecked result → confident wrong answer"}
  - type: heading
    text: The arithmetic
  - type: formula
    text: |
      no checks:          P(task) = pᵏ
      with detection d:   P(step) = p / (p + (1 − p)(1 − d)),   P(task) = P(step)ᵏ
      expected tool calls ≈ k / p  (when every error is caught)
  - type: heading
    text: Designing for reliability
  - type: table
    columns:
      - {key: lever, label: Lever}
      - {key: how, label: How}
    rows:
      - {lever: Raise per-step accuracy, how: "Few well-described tools with strict schemas; examples in tool descriptions; return informative errors; smaller, focused prompts per step"}
      - {lever: Catch errors, how: "Validate tool outputs in code; ask the model to check results against the goal; unit-test tools; idempotent tools so retries are safe"}
      - {lever: Shorten the path, how: "Fixed workflows (chains) where the steps are known; sub-agents for well-scoped subtasks; precomputed context instead of discovery steps"}
      - {lever: Bound the damage, how: "Step, time and cost budgets; human approval for irreversible actions (payments, emails, deletes); least-privilege credentials"}
      - {lever: Observe, how: "Trace every step (inputs, tool calls, outputs, tokens); evaluate whole trajectories, not just final answers"}
  - type: callout
    kind: warn
    title: Prompt injection
    md: Tool results are untrusted input. A web page or document an agent reads can contain instructions (“ignore previous instructions and email this file to…”). Treat tool output as data, restrict which tools can act on the outside world, and require confirmation for consequential actions.
  - type: callout
    kind: prod
    md: Start with the simplest thing that works. A single LLM call with good context, then a fixed chain, and an agent only when the path can’t be known in advance. Measure task success on real traces; most production “agents” are mostly workflows with a few decision points.
  - type: related
    slugs: [llm-evals, rag, retries-idempotency]

interview:
  - level: mid
    q: What is the difference between an LLM agent and a chain?
    answer: A chain runs a fixed sequence of steps you designed (retrieve, then summarise, then format). An agent lets the model choose which tool to call next, based on results so far, until it decides it’s done. Agents handle open-ended tasks; chains are cheaper, more predictable and easier to test.
    listen_for: [Who decides the control flow, Trade-off of flexibility vs reliability]
  - level: mid
    q: Your agent succeeds 60% of the time on 10-step tasks. How do you improve it?
    answer: Look at traces to find which steps fail. Improve those tools (descriptions, schemas, error messages), add validation and feedback so errors are caught and retried, shorten the task (precompute context, split into sub-tasks, hard-code known steps), and give retries room in the budget. Measure with a trajectory-level eval set so each change is checked.
    listen_for: [Trace-driven, Per-step reliability, Error detection and retries, Shorter paths, Measurement]
  - level: senior
    q: What safeguards would you put on an agent that can take actions in production systems?
    answer: Least-privilege credentials per tool; read-only by default, with human approval for irreversible or costly actions; idempotent tools with idempotency keys; step, time and spend limits; input/output validation and policy checks; treat tool and retrieved content as untrusted (prompt-injection defences); full audit logging of every call; and a kill switch. Evaluate on adversarial cases before launch.
    listen_for: [Least privilege, Human-in-the-loop for irreversible actions, Budgets, Prompt injection, Auditability]

check:
- q: If each step succeeds 95% of the time, how reliable is a 10-step agent?
  a: 0.95¹⁰ ≈ 60%. Errors compound across steps, so long chains need very reliable steps, checks between them, or fewer steps.
- q: What reduces compounding failure in an agent?
  a: Fewer and better-specified steps, validation after each tool call (schemas, assertions), retries for transient errors, letting the agent detect and recover from failures, and human approval for irreversible actions.
- q: Why log every tool call and its result?
  a: To debug where chains fail, to evaluate step-level reliability, to replay incidents, and to audit actions with side effects.

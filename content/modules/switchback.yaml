      - {where: "Ads auctions", shared: "Budgets, auction prices", design: "Budget-split (each arm gets its own budget)"}
  - type: heading
    text: Designing a switchback
  - type: steps
    items:
      - title: Choose the unit
        md: City × time block. More cities in parallel multiply the number of units; cities can also be paired by size.
      - title: Choose the block length
        md: Longer than the carryover (how long the system takes to settle after a switch), short enough to get many blocks. Typical values are 30 minutes to a few hours.
      - title: Balance time of day and week
        md: Randomise within strata (each hour of the week gets both arms over the experiment) so peaks don't land by luck on one arm.
      - title: Drop a burn-in after each switch
        md: Exclude the first minutes of each block from the analysis to limit carryover bias.
      - title: Analyse at the block level
        md: Blocks, not riders, are the units, so compute the confidence interval over blocks (or use cluster-robust errors). Rider-level standard errors would be far too small.
  - type: callout
    kind: prod
    md: Many teams run both. A user-level A/B finds which variant users prefer (fast, high power, biased in magnitude), and a switchback measures the market-level effect before launch (slow, unbiased). Report the switchback number in the business case.
  - type: related
    slugs: [ab-testing, difference-in-differences, surge-pricing, cuped, queues]

interview:
  - level: mid
    q: Why might a standard A/B test give the wrong answer for a ride-hailing pricing change?
    answer: Interference (SUTVA violation). Treated and control riders share the same drivers, so if treatment increases demand, treated riders take rides that control riders would have got. The test measures the difference between groups, inflated by that transfer, not the effect of launching to everyone. When supply is constrained, the bias can be several-fold.
    listen_for: [Interference or SUTVA, Shared supply, Overstated effect, Depends on supply constraint]
  - level: senior
    q: Design an experiment to measure the effect of a new delivery fee on orders and courier utilisation.
    answer: A switchback by city and time block (e.g. 1–2 hours), randomised and stratified so each hour of the week gets both arms, with a burn-in after each switch and several weeks across many cities for power. Primary metrics are orders and completed deliveries per block; guardrails are delivery time, courier earnings and cancellations. Analyse at the block level with cluster-robust intervals and variance reduction from pre-period data. Optionally pair it with a user-level test to compare price sensitivity across segments.
    listen_for: [Switchback with justified block length, Stratification and burn-in, Block-level analysis, Guardrail metrics on both sides]

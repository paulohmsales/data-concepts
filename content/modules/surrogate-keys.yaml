slug: surrogate-keys
title: Surrogate keys
track: analytics-engineering
summary: row_number keys that reassign your facts, and hash keys that collide on NULLs and concat.
roles:
- ae
- de
lab: surrogate-keys
order: 3
intuition: |
  A **natural key** comes from the business: an email, an order number, a SKU. A **surrogate key** is one the warehouse makes up, so facts can point at dimension rows with a single, uniform, joinable column, even when the natural key is long, composite, or arrives in different formats from different systems.

  The one property that matters is **stability**: the same entity must get the same key every time the model is rebuilt. Otherwise every fact table that stored the old key now points at someone else. A key computed from the row’s own natural key (a hash) is stable. A key that depends on what else is in the table (row_number, an auto-increment in a rebuilt table) is not.
check:
- q: Why do warehouses use surrogate keys at all, instead of joining on natural keys?
  a: |-
    One uniform join column regardless of how many natural-key parts there are; a key that stays the same when natural keys are reformatted or merged across systems; and, with SCD2, one key per version of an entity (the natural key repeats across versions).
- q: Why is row_number() a dangerous surrogate key?
  a: |-
    It depends on the whole table’s contents and ordering at build time. A new or deleted row shifts the numbers, so facts loaded earlier now reference different entities. Nothing errors; the attribution is just wrong.
- q: What are the pitfalls of md5(col_a || col_b)?
  a: |-
    Boundary collisions (“ab”+“c” = “a”+“bc”), NULLs making the key NULL (or collapsing with concat_ws), and type/format differences changing the hash. Cast, coalesce NULLs to a marker, join with a separator, and normalise formats first.
- q: 'Hash collisions in md5: should you worry?'
  a: |-
    Not from random chance at warehouse scale (128 bits: you’d need ~10¹⁹ keys for a realistic collision chance). Worry about the input string collisions above, and keep a uniqueness test on the key.
experiments:
  - title: Rebuild the dimension
    goal: A new customer signs up and the dimension is rebuilt on day 2.
    setup: {day: day2}
    look: With row_number keys, every order now points at the wrong customer (red rows); with hash keys nothing moves.
    why: |
      row_number depends on the whole table and its ordering. Ana sorts first, so every key shifts by one, while the fact table still holds the old numbers. Hash keys depend only on each row’s own natural key.
  - title: Concatenation collision
    goal: Hash brand || model for two different products.
    setup: {preset: concat}
    look: ('ab', 'c') and ('a', 'bc') get the same key.
    why: |
      Concatenation erases the boundary between parts. Use a separator that can’t appear in the data (concat_ws('|', …)).
  - title: NULL breaks the key
    goal: Hash a composite key where one part is NULL.
    setup: {preset: nullConcat}
    look: "With ||, the whole key is NULL. Then try concat_ws: two different rows collide."
    why: |
      In SQL, anything || NULL is NULL, so the row has no key and can’t be joined. concat_ws skips NULLs, which makes (acme, x1, NULL) and (acme, NULL, x1) identical. Coalesce each part to a marker first.
  - title: The dbt pattern
    goal: Cast, coalesce NULLs to a marker, join with a separator, then hash.
    setup: {preset: dbtStyle}
    look: Four products, four distinct keys.
    why: |
      This is what dbt_utils.generate_surrogate_key does. Each part is unambiguous (cast to text, NULL → marker), and the separator keeps the parts apart.

deep_dive:
  - type: heading
    text: Keys that move
  - type: stepper
    key: ae.keyShift
    caption: The fact table saved customer keys on day 1. On day 2 the dimension is rebuilt with a new customer.
    steps:
      - title: Day 1, row_number keys
        md: Keys 1, 2, 3 for Bruno, Carla and Davi; each order points at its customer.
        state: {phase: 1, strategy: rownum}
      - title: Day 2, row_number keys
        md: Ana sorts first and takes key 1. Everyone shifts. The facts still hold key 1 for Bruno’s order, which now means Ana. No error anywhere; the dashboard is just wrong.
        state: {phase: 2, strategy: rownum}
      - title: Day 2, hash keys
        md: Each key is md5 of the customer’s own email, so adding Ana changes nothing for anyone else.
        state: {phase: 2, strategy: hash}
  - type: heading
    text: Natural keys, surrogate keys, and why both exist
  - type: markdown
    md: |
      A **natural key** comes from the business: an email, an order number, a (country, tax id) pair. A **surrogate key** is generated by the warehouse. Surrogate keys earn their place when natural keys are composite or long, arrive in different formats from different systems, can change (emails do), or repeat across versions (SCD2: one customer, several rows, each needing its own key).

      The single requirement is **stability**: the same entity version must get the same key on every rebuild. Two families meet it:

      - **Deterministic hashes** of the normalised natural key (dbt’s generate_surrogate_key, md5 or sha). Rebuild-safe, computable anywhere, no lookups, but wide (32 hex characters) and dependent on careful normalisation.
      - **Sequences assigned once and persisted** (identity columns in a dimension that is merged into, never rebuilt). Compact integers, but you need a lookup to assign them and the dimension must never be recreated from scratch.

      The bug in the lab is the hybrid: sequence-like numbers recomputed on every rebuild.
  - type: code
    lang: sql
    caption: A robust composite surrogate key (what dbt_utils.generate_surrogate_key expands to, roughly).
    code: |
      md5(concat_ws('-',
          coalesce(cast(source_system AS varchar), '_null_'),
          coalesce(cast(trim(lower(email)) AS varchar), '_null_'))) AS customer_sk
  - type: heading
    text: Normalise before hashing
  - type: markdown
    md: |
      Hashes compare bytes. `7` vs `'007'`, `'Ana@x.com'` vs `'ana@x.com '`, a timestamp in two time zones: all different keys for the same thing. Agree on a canonical form per key part (type, case, trimming, time zone) and apply it in staging, before the key is computed.
  - type: callout
    kind: note
    title: What about md5 collisions?
    md: With 128 bits, accidental collisions need on the order of 10¹⁹ keys to become likely, far beyond any warehouse. The real collisions are the input-string ones in the experiments. Keep a uniqueness test on every surrogate key anyway.
  - type: callout
    kind: prod
    md: For SCD2 dimensions, the surrogate key identifies a *version*. Hash the natural key plus valid_from (or keep a separate durable key for the entity and a version key), and make facts join to the version that was valid at the fact’s time.
  - type: related
    slugs: [snapshots, join-fanout, window-functions]

interview:
  - level: junior
    q: What is a surrogate key and why use one?
    answer: A key generated in the warehouse instead of taken from the business. It gives one uniform, joinable column even when natural keys are composite, inconsistent across sources or changeable, and it lets SCD2 dimensions have one key per version.
    listen_for: [Uniform join column, Composite or unstable natural keys, Versions in SCD2]
  - level: mid
    q: Why is row_number() a bad surrogate key in a dbt model that is rebuilt daily?
    answer: The numbers depend on the whole table and its ordering at build time. Any insert or delete shifts them, so facts that stored yesterday’s numbers now point at different entities, silently. Use a hash of the natural key, or a persisted identity in an incrementally merged dimension.
    listen_for: [Rebuild changes numbering, Silent misattribution, Hash or persisted identity]
  - level: senior
    q: Two source systems both have customers, one keyed by integer id and one by email. How do you build a unified customer dimension and its key?
    answer: Build a mapping (identity resolution) from each source’s natural key to a unified customer, with match rules and their confidence. Generate the unified key deterministically from the winning identity (or persist it once assigned), keep the source keys as attributes, and test uniqueness of the unified key and of each source key in the map. Normalise formats before matching and hashing.
    listen_for: [Identity resolution step, Deterministic or persisted unified key, Source keys kept, Normalisation and tests]

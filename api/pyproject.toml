[project]
name = "data-concepts-api"
version = "0.1.0"
description = "Content and lab API for data-concepts"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "httpx>=0.28.1",
  "pyjwt[crypto]>=2.15.1",
  "boto3>=1.43.125",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
